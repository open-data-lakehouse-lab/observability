[project]
name = "odl-observability"
version = "0.1.0"
description = "Observability foundation for Open Data Lakehouse Lab"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic",
    "typer",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[project.scripts]
odl-observability = "odl_observability.cli:app"

[tool.ruff]
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
